name: Fix imported document deletion UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/fix-import-delete-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace deletion UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<!-- imported-documents-delete-ui-v1 -->')
          if start < 0:
              print('Marker not found')
              raise SystemExit(0)
          body=s.find('</body>', start)
          if body < 0:
              raise SystemExit('body end not found')
          script='''<!-- imported-documents-delete-ui-v2 -->
          <script>
          (function(){
            function escDoc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
            function renderDocs(){
              const list=document.getElementById('importedDocsList');
              if(!list || typeof cards==='undefined') return;
              const groups=new Map();
              cards.forEach(c=>{
                const show=String(c.show||'').trim();
                const song=String(c.song||'').trim();
                if(!show && !song) return;
                const key=show+'\\u0000'+song;
                if(!groups.has(key)) groups.set(key,{show,song,count:0});
                groups.get(key).count++;
              });
              const rows=[...groups.values()].sort((a,b)=>(a.show+' '+a.song).localeCompare(b.show+' '+b.song));
              if(!rows.length){list.innerHTML='<div class="hint">No imported documents found yet.</div>';return;}
              list.innerHTML=rows.map((g,i)=>{
                const label=[g.show,g.song].filter(Boolean).join(' — ') || 'Imported document';
                return '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">'
                  +'<div><div style="font-family:Fraunces,serif;font-weight:600;font-size:15px">'+escDoc(label)+'</div><div class="hint">'+g.count+' word'+(g.count===1?'':'s')+'</div></div>'
                  +'<button class="btn ghost small" data-delete-import="'+i+'">Delete document</button></div>';
              }).join('');
              list.querySelectorAll('[data-delete-import]').forEach(btn=>btn.onclick=()=>{
                const g=rows[Number(btn.dataset.deleteImport)]; if(!g) return;
                const label=[g.show,g.song].filter(Boolean).join(' — ') || 'this document';
                if(!confirm('Delete '+label+' from this browser?\\n\\nThis removes all vocabulary cards belonging to this imported document.')) return;
                const before=cards.length;
                const keep=cards.filter(c=>!(String(c.show||'').trim()===g.show && String(c.song||'').trim()===g.song));
                cards.length=0; cards.push(...keep);
                if(typeof persistCards==='function') persistCards();
                if(typeof renderAll==='function') renderAll();
                renderDocs();
                const msg=document.getElementById('autoGenMsg');
                if(msg) msg.textContent='Deleted '+(before-cards.length)+' cards from '+label+'.';
              });
            }
            function mount(){
              if(document.getElementById('importedDocsPanel')){renderDocs();return;}
              const view=document.getElementById('view-import'); if(!view) return;
              const panel=document.createElement('div'); panel.id='importedDocsPanel'; panel.className='divider';
              panel.innerHTML='<div style="margin-top:22px"><h2 class="section-title">Imported documents</h2><p class="subtle">Your imported songs are stored in this browser. Delete one document at a time when you no longer need it.</p><div id="importedDocsList"></div></div>';
              view.appendChild(panel); renderDocs();
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
          })();
          </script>
          '''
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          s=s[:start]+script+'\n'+s[body:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix imported document deletion UI'
          git push
