name: Repair imported-document deletion UI
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/repair-import-delete.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair injected script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- imported-documents-delete-ui-v1 -->'
          start=s.find(marker)
          if start < 0:
              print('Marker not found; nothing to repair')
              raise SystemExit(0)
          end=s.find('</script>', start)
          if end < 0:
              raise SystemExit('Injected script end not found')
          end += len('</script>')
          block=s[start:end]
          repaired=block.replace('\\\n','\n')
          if repaired == block:
              print('Already repaired')
              raise SystemExit(0)
          s=s[:start]+repaired+s[end:]
          p.write_text(s, encoding='utf-8')
          print('Repaired imported-document deletion UI')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair imported document deletion UI'
          git push
